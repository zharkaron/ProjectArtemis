###############################################################
#                   Authelia configuration                    #
###############################################################

host: 0.0.0.0
port: 9091
log_level: info
jwt_secret: 6ac55e2d727eebe2e4b6264a5a9ffd8f91f2cbb09e6ae99116b9ba1222796658

default_redirection_url: https://homepage.zharkaron.lab

totp:
  issuer: zharkaron.lab
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: authelia.zharkaron.lab
      policy: bypass
    - domain: "*.zharkaron.lab"
      policy: bypass
      networks:
        - 10.8.0.0/24
    - domain: "*.zharkaron.lab"
      policy: one_factor

session:
  name: authelia_session
  secret: ebc24c1af501b9875c229149f559ce746648fe35d52609fc21611bd98ff56de8
  expiration: 24h
  inactivity: 2h
  remember_me_duration: 30d
  redis:
    host: authelia-redis
    port: 6379
    database_index: 0
    maximum_active_connections: 10

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notifications.yml
