services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy

    environment:
      - WG_HOST=165.227.12.213
      - PASSWORD=ChangeThisPassword123
      - WG_PORT=51820

    volumes:
      - ./wireguard:/etc/wireguard

    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1

    restart: unless-stopped
